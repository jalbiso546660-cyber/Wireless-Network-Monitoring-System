{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Change password</h1>
<div class="card" style="max-width:32rem"><div class="card-body">
  <form method="post" action="{{ url_for('auth.account_password') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label small mb-1">Current password</label>
      <input name="current_password" type="password" class="form-control" required autocomplete="current-password">
    </div>
    <div class="mb-3">
      <label class="form-label small mb-1">New password</label>
      <input name="new_password" type="password" class="form-control" required autocomplete="new-password">
      <div class="form-text">Minimum 8 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label small mb-1">Confirm new password</label>
      <input name="confirm_password" type="password" class="form-control" required autocomplete="new-password">
    </div>
    <button class="btn btn-primary">Change password</button>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
