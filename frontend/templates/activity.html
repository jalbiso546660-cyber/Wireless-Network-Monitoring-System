{% extends "base.html" %}
{% block title %}Activity{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
  <h1 class="h3 mb-0">Activity</h1>
  <form method="get" action="{{ url_for('dashboard.activity') }}" class="d-flex gap-2 align-items-center">
    <label class="form-label small mb-0">Date</label>
    <input type="date" name="date" value="{{ sel_date }}"
           class="form-control form-control-sm" data-autosubmit>
  </form>
</div>

<!-- Chart 4.1 — presence timeline (the most important access-history visual) -->
<div class="card mb-4"><div class="card-body">
  <h2 class="h6 text-body-secondary">Device presence timeline {{ sel_date }}</h2>
  <div class="chart-scroll">
    <div class="chart-box"><canvas id="chart-presence" data-date="{{ sel_date }}"></canvas></div>
  </div>
</div></div>

<!-- Chart 4.2 — occupancy over time, quiet-hours band shaded -->
<div class="card"><div class="card-body">
  <h2 class="h6 text-body-secondary">Network occupancy</h2>
  <div class="chart-box"><canvas id="chart-occupancy"></canvas></div>
</div></div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
